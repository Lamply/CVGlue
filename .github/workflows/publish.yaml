name: Publish Python Package to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs 需要完整的历史记录来推算版本号

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Hatch
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Upload dists
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cvglue

    permissions:
      id-token: write  # 必需：允许 OIDC 身份验证
      contents: write  # 允许创建 GitHub Release（可选）

    steps:
      - name: Download dists
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*