[build-system]
requires = ["hatchling >= 1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cvglue"
authors = [
  { name="Lamply", email="lamplykyz@gmail.com" },
]
description = "Glue tools of computer vision"
keywords = [
    "computer vision"
]
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "termcolor",
    "deepdiff",
    "albumentations >= 1.1.0, <= 1.3.1",
    "numpy",
    "opencv-python",
    "matplotlib",
    "scikit-image",
    "scikit-learn",
    "imageio-ffmpeg",
    "lpips",
    "onnxruntime-gpu",
    "torch >= 1.6.0"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Lamply/CVGlue"
Issues = "https://github.com/Lamply/CVGlue/issues"

[project.optional-dependencies]
option1 = [
  "insightface",
  "face_recognition"
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["cvglue"]
include = [
  "cvglue/*.json",
  "cvglue/*.pth",
  "cvglue/*.onnx",
  "cvglue/*.yaml"
]

[tool.hatch.envs.default]
dependencies = [
  "pytest>=7.0",
  "ruff"
]

[tool.hatch.envs.default.scripts]
test = "pytest tests/ -v"
lint = "ruff check ."
format = "ruff format ."

[tool.ruff]
exclude = ["cvglue/thirdparty"]
